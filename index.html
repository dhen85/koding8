<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menemukan Solusi dengan Berpikir Komputasional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0fdf4; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        .slide-up { animation: slideUp 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px;}
        ::-webkit-scrollbar-thumb { background: #4ade80; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #22c55e; }

        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .btn-press { transition: transform 0.1s; }
        .btn-press:active { transform: scale(0.95); }
        
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; transition: transform 0.6s; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .backface-hidden { backface-visibility: hidden; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex flex-col overflow-hidden bg-slate-100">
    <div id="root" class="h-full w-full flex flex-col max-w-5xl mx-auto relative shadow-2xl bg-white overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Modal = ({ isOpen, title, message, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 px-4 fade-in">
                    <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl slide-up">
                        <h3 className="text-xl font-bold text-slate-800 mb-2">{title}</h3>
                        <p className="text-slate-600 mb-6 whitespace-pre-line">{message}</p>
                        <button onClick={onClose} className="w-full py-3 bg-green-500 text-white rounded-xl font-semibold btn-press hover:bg-green-600">
                            Mengerti
                        </button>
                    </div>
                </div>
            );
        };

        const Phase1 = ({ onComplete }) => {
            const [checks, setChecks] = useState([false, false, false]);
            const progress = (checks.filter(Boolean).length / 3) * 100;

            const toggleCheck = (index) => {
                const newChecks = [...checks];
                newChecks[index] = !newChecks[index];
                setChecks(newChecks);
            };

            return (
                <div className="flex-1 overflow-y-auto p-5 md:p-8 pb-8 space-y-6 slide-up max-w-4xl mx-auto w-full custom-scrollbar">
                    <div className="bg-gradient-to-r from-green-500 to-emerald-600 rounded-2xl p-6 md:p-8 text-white shadow-lg">
                        <h2 className="text-2xl md:text-3xl font-bold mb-2">Fase 1: Memorais</h2>
                        <p className="text-green-50 text-sm md:text-base">Pelajari materi utuh berikut. Centang setiap bab setelah memahaminya untuk membuka fase selanjutnya.</p>
                        
                        <div className="mt-4 bg-white/20 rounded-full h-3 w-full overflow-hidden">
                            <div className="bg-white h-full transition-all duration-500" style={{ width: `${progress}%` }}></div>
                        </div>
                        <p className="text-right text-xs mt-1 font-bold">{Math.round(progress)}% Selesai</p>
                    </div>

                    <div className="space-y-8 text-sm leading-relaxed text-slate-700">
                        <div className="glass-card p-5 rounded-2xl shadow-sm border border-slate-100">
                            <h3 className="text-lg font-bold text-green-600 mb-3 border-b pb-2">BAB 1: Menemukan Solusi & Pengolahan Data</h3>
                            <p className="mb-2">Dalam kehidupan sehari-hari, kita sering menghadapi data. Untuk mengambil keputusan tepat, kita perlu mengolahnya menggunakan prinsip berpikir komputasional dan spreadsheet.</p>
                            <div className="bg-yellow-50 border-l-4 border-yellow-400 p-3 mb-3 text-xs text-yellow-800 rounded">
                                <strong>💡 Kamus Pintar:</strong> Berpikir komputasional adalah cara berpikir logis dan sistematis layaknya komputer. Algoritma adalah serangkaian langkah logis berurutan.
                            </div>
                            <p className="font-bold">4 Fondasi Berpikir Komputasional:</p>
                            <ul className="list-disc pl-5 mb-3 space-y-1">
                                <li><strong>Dekomposisi:</strong> Memecah masalah besar menjadi bagian kecil.</li>
                                <li><strong>Pengenalan Pola:</strong> Menentukan pola yang menyederhanakan proses.</li>
                                <li><strong>Abstraksi:</strong> Fokus pada data penting, abaikan yang tidak relevan.</li>
                                <li><strong>Menyusun Algoritma:</strong> Tentukan langkah-langkah logis.</li>
                            </ul>
                            <p className="font-bold mt-4">Fungsi Spreadsheet Utama:</p>
                            <div className="overflow-x-auto my-2">
                                <table className="w-full text-xs text-left border-collapse">
                                    <thead><tr className="bg-green-100"><th className="p-2 border">Fungsi</th><th className="p-2 border">Kegunaan</th></tr></thead>
                                    <tbody>
                                        <tr><td className="p-2 border font-bold">MAX()</td><td className="p-2 border">Mencari nilai tertinggi.</td></tr>
                                        <tr><td className="p-2 border font-bold">MIN()</td><td className="p-2 border">Mencari nilai terendah.</td></tr>
                                        <tr><td className="p-2 border font-bold">AVERAGE()</td><td className="p-2 border">Menghitung rata-rata.</td></tr>
                                        <tr><td className="p-2 border font-bold">COUNT()</td><td className="p-2 border">Menghitung jumlah data.</td></tr>
                                        <tr><td className="p-2 border font-bold">SUM()</td><td className="p-2 border">Menjumlahkan total seluruh nilai.</td></tr>
                                        <tr><td className="p-2 border font-bold">IF()</td><td className="p-2 border">Mengecek kondisi (keputusan).</td></tr>
                                        <tr><td className="p-2 border font-bold">SORT() & FILTER()</td><td className="p-2 border">Mengurutkan dan menyaring data.</td></tr>
                                    </tbody>
                                </table>
                            </div>
                            
                            <label className="flex items-center space-x-3 mt-4 bg-slate-50 p-3 rounded-lg border cursor-pointer hover:bg-slate-100 transition">
                                <input type="checkbox" checked={checks[0]} onChange={() => toggleCheck(0)} className="w-5 h-5 text-green-600 rounded focus:ring-green-500"/>
                                <span className="font-semibold text-slate-700">Saya telah memahami Bab 1</span>
                            </label>
                        </div>

                        <div className="glass-card p-5 rounded-2xl shadow-sm border border-slate-100">
                            <h3 className="text-lg font-bold text-green-600 mb-3 border-b pb-2">BAB 2: Pseudocode & Analisis Lanjutan</h3>
                            <p className="mb-2"><strong>Pseudocode</strong> adalah cara menuliskan algoritma dalam bentuk bahasa manusia yang mengikuti struktur pemrograman. Tidak dijalankan oleh komputer, tapi untuk perencanaan.</p>
                            <p className="mb-2">Pseudocode punya 3 struktur kontrol:</p>
                            <ol className="list-decimal pl-5 mb-3 space-y-1 font-semibold">
                                <li>Urutan (Sequence) - Langkah satu per satu.</li>
                                <li>Percabangan (Selection) - Memilih jalur sesuai kondisi (IF/ELSE).</li>
                                <li>Pengulangan (Looping) - Diulang selama kondisi terpenuhi.</li>
                            </ol>
                            <label className="flex items-center space-x-3 mt-4 bg-slate-50 p-3 rounded-lg border cursor-pointer hover:bg-slate-100 transition">
                                <input type="checkbox" checked={checks[1]} onChange={() => toggleCheck(1)} className="w-5 h-5 text-green-600 rounded focus:ring-green-500"/>
                                <span className="font-semibold text-slate-700">Saya telah memahami Bab 2</span>
                            </label>
                        </div>

                        <div className="glass-card p-5 rounded-2xl shadow-sm border border-slate-100">
                            <h3 className="text-lg font-bold text-green-600 mb-3 border-b pb-2">BAB 3: Menggambarkan Algoritma dalam Flowchart</h3>
                            <p className="mb-2"><strong>Flowchart (Diagram Alir)</strong> memvisualisasikan algoritma dengan simbol standar internasional.</p>
                            <div className="grid grid-cols-2 gap-2 my-4 text-xs text-center">
                                <div className="bg-slate-50 p-2 rounded border"><div className="w-10 h-6 border-2 border-black rounded-full mx-auto mb-1"></div><strong>Terminator:</strong> Mulai/Selesai</div>
                                <div className="bg-slate-50 p-2 rounded border"><div className="w-10 h-6 border-2 border-black mx-auto mb-1"></div><strong>Proses:</strong> Tindakan</div>
                                <div className="bg-slate-50 p-2 rounded border"><div className="w-10 h-6 border-2 border-black mx-auto mb-1 transform skew-x-[-20deg]"></div><strong>Input/Output</strong></div>
                                <div className="bg-slate-50 p-2 rounded border"><div className="w-8 h-8 border-2 border-black mx-auto mb-1 transform rotate-45"></div><strong className="block mt-1">Decision:</strong> Ya/Tidak</div>
                            </div>
                            <label className="flex items-center space-x-3 mt-4 bg-slate-50 p-3 rounded-lg border cursor-pointer hover:bg-slate-100 transition">
                                <input type="checkbox" checked={checks[2]} onChange={() => toggleCheck(2)} className="w-5 h-5 text-green-600 rounded focus:ring-green-500"/>
                                <span className="font-semibold text-slate-700">Saya telah memahami Bab 3</span>
                            </label>
                        </div>

                        {progress === 100 && (
                            <button onClick={onComplete} className="w-full py-4 bg-green-500 text-white rounded-xl font-bold text-lg shadow-lg hover:bg-green-600 btn-press slide-up">
                                Buka Fase 2: Recall <i className="fas fa-unlock ml-2"></i>
                            </button>
                        )}
                    </div>
                </div>
            );
        };

        const Phase2 = ({ onComplete }) => {
            const [mode, setMode] = useState('flashcard');
            const [fcIndex, setFcIndex] = useState(0);
            const [fcFlipped, setFcFlipped] = useState(false);
            const [stars, setStars] = useState(0);
            const [modal, setModal] = useState({ isOpen: false, title: '', message: '' });

            // Ditambahkan 2 flashcard mengenai rumus fungsi
            const flashcards = [
                { term: "Berpikir Komputasional", def: "Cara berpikir logis dan sistematis menyelesaikan masalah layaknya komputer." },
                { term: "Dekomposisi", def: "Memecah masalah besar menjadi bagian-bagian kecil agar mudah diselesaikan." },
                { term: "Flowchart", def: "Diagram alir visual yang menggunakan simbol untuk menggambarkan algoritma." },
                { term: "Fungsi IF()", def: "Fungsi spreadsheet untuk menguji kondisi tertentu dan menampilkan hasil jika kondisi Benar atau Salah." },
                { term: "Fungsi SUM()", def: "Fungsi spreadsheet yang digunakan untuk menjumlahkan total seluruh data angka dalam range tertentu." }
            ];

            const [matches, setMatches] = useState([]);
            const [selectedLeft, setSelectedLeft] = useState(null);
            const [selectedRight, setSelectedRight] = useState(null);
            
            // Total 7 Item untuk dicocokkan
            const matchItems = [
                { id: 'l1', text: 'Mencari Rata-rata', match: 'r1' },
                { id: 'l2', text: 'Simbol Elips Flowchart', match: 'r2' },
                { id: 'l3', text: 'Simbol Belah Ketupat', match: 'r3' },
                { id: 'l4', text: 'Mencari Nilai Tertinggi', match: 'r4' },
                { id: 'l5', text: 'Menjumlahkan Total', match: 'r5' },
                { id: 'l6', text: 'Memecah Masalah Besar', match: 'r6' },
                { id: 'l7', text: 'Simbol Persegi Panjang', match: 'r7' }
            ];
            const matchTargets = [
                { id: 'r5', text: 'SUM()' },
                { id: 'r2', text: 'Terminator (Mulai/Selesai)' },
                { id: 'r4', text: 'MAX()' },
                { id: 'r1', text: 'AVERAGE()' },
                { id: 'r7', text: 'Proses (Tindakan)' },
                { id: 'r3', text: 'Decision (Keputusan)' },
                { id: 'r6', text: 'Dekomposisi' }
            ];

            const handleNextFC = () => {
                if (!fcFlipped) {
                    setModal({ isOpen: true, title: "Tunggu!", message: "Balik kartu dulu untuk membaca pembahasannya ya." });
                    return;
                }
                if (fcIndex < flashcards.length - 1) {
                    setFcFlipped(false);
                    setTimeout(() => setFcIndex(fcIndex + 1), 300);
                    setStars(stars + 10);
                } else {
                    setStars(stars + 10);
                    setMode('match');
                    setModal({ isOpen: true, title: "Luar Biasa!", message: "Kamu menyelesaikan Flashcard! Mari lanjut ke Game Mencocokkan." });
                }
            };

            const handleMatch = (side, id) => {
                if (side === 'left') setSelectedLeft(id);
                if (side === 'right') setSelectedRight(id);
            };

            useEffect(() => {
                if (selectedLeft && selectedRight) {
                    const leftItem = matchItems.find(i => i.id === selectedLeft);
                    if (leftItem.match === selectedRight) {
                        setMatches([...matches, leftItem.match]);
                        setStars(s => s + 15);
                        setSelectedLeft(null); setSelectedRight(null);
                        
                        // Cek jika sudah 7 pasang terpenuhi
                        if (matches.length === 6) { 
                            setTimeout(() => {
                                setModal({ isOpen: true, title: "Fase 2 Selesai!", message: "Poin penuh! Kamu berhak masuk ke Simulasi Lab." });
                                onComplete();
                            }, 500);
                        }
                    } else {
                        setModal({ isOpen: true, title: "Oops!", message: "Pasangan tidak cocok. Coba lagi!" });
                        setSelectedLeft(null); setSelectedRight(null);
                    }
                }
            }, [selectedLeft, selectedRight]);

            return (
                <div className="flex-1 overflow-y-auto p-5 md:p-8 pb-8 slide-up flex flex-col items-center bg-blue-50 w-full custom-scrollbar">
                    <div className="w-full max-w-4xl flex justify-between items-center bg-white p-3 md:p-4 rounded-xl shadow-sm mb-6">
                        <h2 className="font-bold text-blue-600 md:text-xl">Fase 2: Recall</h2>
                        <div className="font-bold text-yellow-500 bg-yellow-50 px-3 py-1 rounded-full flex items-center md:text-lg">
                            <i className="fas fa-star mr-1"></i> {stars}
                        </div>
                    </div>

                    <Modal isOpen={modal.isOpen} title={modal.title} message={modal.message} onClose={() => setModal({ ...modal, isOpen: false })} />

                    {mode === 'flashcard' && (
                        <div className="w-full max-w-md md:max-w-xl flex flex-col items-center">
                            <p className="text-center mb-4 text-slate-600 text-sm md:text-base">Tap kartu untuk melihat penjelasan, lalu tekan Lanjut.</p>
                            
                            <div className="relative w-full h-64 perspective-1000 cursor-pointer mb-6" onClick={() => setFcFlipped(!fcFlipped)}>
                                <div className={`w-full h-full absolute transform-style-3d ${fcFlipped ? 'rotate-y-180' : ''}`}>
                                    <div className="w-full h-full absolute backface-hidden bg-gradient-to-br from-blue-400 to-indigo-500 text-white rounded-2xl shadow-xl flex items-center justify-center p-6 text-center text-2xl font-bold border-4 border-white">
                                        {flashcards[fcIndex].term}
                                    </div>
                                    <div className="w-full h-full absolute backface-hidden bg-white text-slate-800 rounded-2xl shadow-xl flex items-center justify-center p-6 text-center border-4 border-indigo-400 rotate-y-180 flex-col">
                                        <i className="fas fa-lightbulb text-4xl text-yellow-400 mb-4"></i>
                                        <p className="font-semibold text-lg">{flashcards[fcIndex].def}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="flex justify-between w-full items-center">
                                <span className="text-sm font-bold text-slate-500">Kartu {fcIndex + 1} / {flashcards.length}</span>
                                <button onClick={handleNextFC} className="px-6 py-2 bg-indigo-500 text-white font-bold rounded-full shadow hover:bg-indigo-600 btn-press">
                                    Lanjut <i className="fas fa-arrow-right ml-1"></i>
                                </button>
                            </div>
                        </div>
                    )}

                    {mode === 'match' && (
                        <div className="w-full max-w-4xl fade-in">
                            <p className="text-center mb-4 text-slate-600 text-sm md:text-base font-semibold">Game Mencocokkan: Pilih kotak di kiri, lalu pilih pasangannya di kanan!</p>
                            <div className="flex flex-col md:flex-row justify-between gap-4 w-full">
                                <div className="flex-1 space-y-3">
                                    {matchItems.map(item => (
                                        <button key={item.id} onClick={() => handleMatch('left', item.id)} disabled={matches.includes(item.match)}
                                            className={`w-full p-2 md:p-3 text-xs md:text-sm font-bold rounded-xl border-2 transition ${matches.includes(item.match) ? 'bg-green-100 border-green-400 text-green-700 opacity-50' : selectedLeft === item.id ? 'bg-blue-500 border-blue-600 text-white shadow-lg scale-105' : 'bg-white border-blue-200 text-blue-700 shadow-sm hover:bg-blue-50'}`}>
                                            {item.text}
                                        </button>
                                    ))}
                                </div>
                                <div className="flex-1 space-y-3">
                                    {matchTargets.map(item => (
                                        <button key={item.id} onClick={() => handleMatch('right', item.id)} disabled={matches.includes(item.id)}
                                            className={`w-full p-2 md:p-3 text-xs md:text-sm font-bold rounded-xl border-2 transition ${matches.includes(item.id) ? 'bg-green-100 border-green-400 text-green-700 opacity-50' : selectedRight === item.id ? 'bg-orange-500 border-orange-600 text-white shadow-lg scale-105' : 'bg-white border-orange-200 text-orange-700 shadow-sm hover:bg-orange-50'}`}>
                                            {item.text}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const Phase3 = ({ user, setUser, onComplete, setLabScore, setLabTime }) => {
            const [modal, setModal] = useState({ isOpen: false, title: '', message: '' });
            const [isLogged, setIsLogged] = useState(user.name !== '');
            const [submitted, setSubmitted] = useState(false);
            const [step, setStep] = useState(1);
            
            // Timer State
            const [timeElapsed, setTimeElapsed] = useState(0);

            useEffect(() => {
                let timer;
                if (isLogged && !submitted) {
                    timer = setInterval(() => setTimeElapsed(t => t + 1), 1000);
                }
                return () => clearInterval(timer);
            }, [isLogged, submitted]);

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}m ${s}s`;
            };
            
            // Data Acak 8 Siswa
            const [raw] = useState(() => {
                const r = [];
                for(let i=0; i<8; i++) r.push(Math.floor(Math.random() * 41) + 60);
                return r;
            });
            
            const students = ['Ali', 'Budi', 'Citra', 'Dina', 'Eko', 'Fina', 'Gani', 'Hani'];
            const [tableData, setTableData] = useState(Array(8).fill(''));
            
            // Rumus diacak dari awal
            const baseFormulaCards = [
                '=MAX(B1:B8)', '=MIN(B1:B8)', '=AVERAGE(B1:B8)', 
                '=COUNT(B1:B8)', '=SUM(B1:B8)', '=MEDIAN(B1:B8)', '=COUNTIF(B1:B8,">=80")'
            ];
            const [formulaCards] = useState(() => [...baseFormulaCards].sort(() => Math.random() - 0.5));
            
            const [slots, setSlots] = useState({ max: '', min: '', avg: '', count: '', sum: '', median: '', countif: '' });
            const [activeCard, setActiveCard] = useState(null);
            const [calc, setCalc] = useState({ max: '', min: '', avg: '', count: '', sum: '', median: '', countif: '' });

            // Konfigurasi Pengecekan Slot Rumus
            const slotConfig = [
                { id: 'max', label: 'Nilai Tertinggi', expected: '=MAX(B1:B8)' },
                { id: 'min', label: 'Nilai Terendah', expected: '=MIN(B1:B8)' },
                { id: 'avg', label: 'Rata-rata Kelas', expected: '=AVERAGE(B1:B8)' },
                { id: 'count', label: 'Banyak Data/Siswa', expected: '=COUNT(B1:B8)' },
                { id: 'sum', label: 'Total Seluruh Nilai', expected: '=SUM(B1:B8)' },
                { id: 'median', label: 'Nilai Tengah', expected: '=MEDIAN(B1:B8)' },
                { id: 'countif', label: 'Jumlah Siswa Nilai >= 80', expected: '=COUNTIF(B1:B8,">=80")' }
            ];

            const handleLogin = (e) => {
                e.preventDefault();
                const n = e.target.nama.value;
                const k = e.target.kelas.value;
                const s = e.target.sekolah.value;
                if(n && k && s) {
                    setUser({ name: n, class: k, school: s });
                    setIsLogged(true);
                } else {
                    setModal({ isOpen: true, title: 'Error', message: 'Harap isi semua data.'});
                }
            };

            const verifyStep1 = () => {
                const isCorrect = tableData.every((val, i) => parseInt(val) === raw[i]);
                if (isCorrect) {
                    setStep(2);
                } else {
                    setModal({ isOpen: true, title: 'Cek Lagi!', message: 'Pastikan 8 angka yang dimasukkan persis dengan urutan Data Mentah.' });
                }
            };

            const handleSlotClick = (type) => {
                if (activeCard) {
                    setSlots({ ...slots, [type]: activeCard });
                    setActiveCard(null);
                } else if (slots[type]) {
                    setSlots({ ...slots, [type]: '' });
                }
            };

            const verifyStep2 = () => {
                const isAllCorrect = slotConfig.every(cfg => slots[cfg.id] === cfg.expected);
                if (isAllCorrect) {
                    setStep(3);
                } else {
                    setModal({ isOpen: true, title: 'Ada yang salah', message: 'Penempatan kartu rumus belum tepat. Coba periksa kembali dengan teliti.' });
                }
            };

            const checkLab = () => {
                const checkKeyLab = `lab_${user.name}_${user.class}_${user.school}`.toLowerCase();
                
                if (localStorage.getItem(checkKeyLab)) {
                    setLabScore(localStorage.getItem(checkKeyLab + '_score') || 0);
                    setSubmitted(true);
                    setModal({ 
                        isOpen: true, 
                        title: 'Sudah Mengerjakan', 
                        message: 'Simulasi selesai. Kamu sudah mengerjakan simulasi lab sebelumnya.\n\nKamu hanya diizinkan mencoba satu kali.'
                    });
                    return;
                }

                let score = 20;
                const actualMax = Math.max(...raw);
                const actualMin = Math.min(...raw);
                const actualAvg = Math.round(raw.reduce((a,b)=>a+b, 0) / raw.length);
                const actualCount = raw.length;
                const actualSum = raw.reduce((a,b)=>a+b, 0);
                
                // Kalkulasi Median
                const sorted = [...raw].sort((a,b)=>a-b);
                const actualMedian = (sorted[3] + sorted[4]) / 2;
                
                const actualCountIf = raw.filter(x => x >= 80).length;

                let correctCalc = 0;
                if (parseInt(calc.max) === actualMax) correctCalc++;
                if (parseInt(calc.min) === actualMin) correctCalc++;
                if (parseInt(calc.avg) === actualAvg) correctCalc++;
                if (parseInt(calc.count) === actualCount) correctCalc++;
                if (parseInt(calc.sum) === actualSum) correctCalc++;
                if (parseFloat(calc.median) === actualMedian) correctCalc++;
                if (parseInt(calc.countif) === actualCountIf) correctCalc++;
                
                score += Math.round((correctCalc / 7) * 80);

                const finalTime = formatTime(timeElapsed);

        const questions = [

            { id: 10, type: 'pg', q: "Perhatikan pseudocode berikut.\n\nMulai\nTampilkan \"Pilih menu: 1 = Nasi Goreng, 2 = Mie Ayam\"\nMasukkan pilihan\nJika pilihan = 1\n  Tampilkan \"Kamu memilih Nasi Goreng\"\nJika pilihan = 2\n  Tampilkan \"Kamu memilih Mie Ayam\"\nJika tidak\n  Tampilkan \"Pilihan tidak tersedia\"\nSelesai\n\nSimbol flowchart yang digunakan untuk membuat logika percabangan pseudocode tersebut adalah ....", options: ["terminator dan proses", "terminator dan input", "input dan proses", "input dan decisions"], a: 3 },

            { id: 14, type: 'pg', q: "Fungsi yang digunakan untuk mengecek kondisi (misal: Lulus/Remedial) adalah...", options: ["=FILTER()", "=SORT()", "=IF()", "=AVERAGE()"], a: 2 },
            { id: 15, type: 'pg', q: "Visualisasi data mana yang paling cocok untuk melihat tren dari waktu ke waktu?", options: ["Pie Chart", "Diagram Garis", "Diagram Batang", "Flowchart"], a: 1 },
            { id: 16, type: 'multi', q: "Manakah yang termasuk struktur kontrol dalam Pseudocode? (Pilih 3)", options: ["Urutan (Sequence)", "Visualisasi", "Percabangan (Selection)", "Pengulangan (Looping)"], a: [0, 2, 3] },

            { id: 20, type: 'text', q: "Isian Singkat: Fungsi spreadsheet untuk mencari nilai tertinggi adalah...", a: "max" }
        ];

        const Phase4 = ({ user, labScore, labTime, gasUrl }) => {
            const [qIndex, setQIndex] = useState(0);
            const [userAnswers, setUserAnswers] = useState({});
            const [isFinished, setIsFinished] = useState(false);
            const [finalScore, setFinalScore] = useState(0);
            const [timeElapsed, setTimeElapsed] = useState(0);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, title: '', message: '' });

            useEffect(() => {
                let timer;
                if (!isFinished) {
                    timer = setInterval(() => setTimeElapsed(t => t + 1), 1000);
                }
                return () => clearInterval(timer);
            }, [isFinished]);

            const handleAnswer = (val) => setUserAnswers({ ...userAnswers, [qIndex]: val });

            const handleMultiAnswer = (idx) => {
                const current = userAnswers[qIndex] || [];
                const updated = current.includes(idx) ? current.filter(i => i !== idx) : [...current, idx];
                setUserAnswers({ ...userAnswers, [qIndex]: updated });
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}m ${s}s`;
            };

            const calculateScore = () => {
                let score = 0;
                questions.forEach((q, idx) => {
                    const ans = userAnswers[idx];
                    if (q.type === 'pg' || q.type === 'tf') {
                        if (ans === q.a) score += 5;
                    } else if (q.type === 'text') {
                        if (ans && ans.toLowerCase().trim() === q.a) score += 5;
                    } else if (q.type === 'multi') {
                        if (Array.isArray(ans) && ans.length === q.a.length && ans.every(v => q.a.includes(v))) {
                            score += 5;
                        }
                    }
                });
                return score;
            };

            const finishExam = async () => {
                const checkKeyExam = `exam_${user.name}_${user.class}_${user.school}`.toLowerCase();
                
                if (localStorage.getItem(checkKeyExam)) {
                    setIsFinished(true);
                    setFinalScore(localStorage.getItem(checkKeyExam + '_score') || 0);
                    setModal({ 
                        isOpen: true, 
                        title: 'Sudah Mengerjakan', 
                        message: 'Ujian Telah Diselesaikan.\n\nKamu sudah mengerjakan dan mengirimkan nilai Ujian Akhir sebelumnya. Kamu hanya diizinkan mencoba satu kali.'
                    });
                    return;
                }

                const score = calculateScore();
                setFinalScore(score);
                setIsFinished(true);
                
                localStorage.setItem(checkKeyExam, 'true');
                localStorage.setItem(checkKeyExam + '_score', score);
                
                submitData(score);
            };

            const submitData = async (examScore) => {
                if(!gasUrl) {
                    setModal({ isOpen: true, title: 'Perhatian!', message: `Nilai kamu ${examScore}. Namun pengiriman gagal karena URL Web App Guru belum diatur.`});
                    return;
                }
                
                setIsSubmitting(true);
                try {
                    const fdLab = new URLSearchParams();
                    fdLab.append("Waktu", new Date().toLocaleString("id-ID"));
                    fdLab.append("Nama", user.name);
                    fdLab.append("Kelas", user.class);
                    fdLab.append("Sekolah", user.school);
                    fdLab.append("Tipe_Kegiatan", "Simulasi Lab");
                    fdLab.append("Nilai", labScore);
                    fdLab.append("Waktu_Pengerjaan", labTime);
                    
                    await fetch(gasUrl, { method: "POST", body: fdLab, mode: "no-cors" });

                    const fdExam = new URLSearchParams();
                    fdExam.append("Waktu", new Date().toLocaleString("id-ID"));
                    fdExam.append("Nama", user.name);
                    fdExam.append("Kelas", user.class);
                    fdExam.append("Sekolah", user.school);
                    fdExam.append("Tipe_Kegiatan", "Exam Final");
                    fdExam.append("Nilai", examScore);
                    fdExam.append("Waktu_Pengerjaan", formatTime(timeElapsed));
                    
                    await fetch(gasUrl, { method: "POST", body: fdExam, mode: "no-cors" });
                    
                    setModal({ 
                        isOpen: true, 
                        title: 'Berhasil!', 
                        message: 'Selamat! Nilai Simulasi Lab dan Ujian Akhir kamu telah berhasil direkam ke server Guru.'
                    });
                } catch (error) {
                    setModal({ isOpen: true, title: 'Info Pengiriman', message: 'Ujian selesai dikerjakan. Jika nilai belum terkirim karena offline, akan disimpan secara lokal.'});
                }
                setIsSubmitting(false);
            };

            if (isFinished) {
                return (

                    {view === 'p1' && <Phase1 onComplete={() => { setUnlockedPhase(Math.max(unlockedPhase, 2)); setView('home'); }} />}
                    {view === 'p2' && <Phase2 onComplete={() => { setUnlockedPhase(Math.max(unlockedPhase, 3)); setView('home'); }} />}
                    {view === 'p3' && <Phase3 user={user} setUser={setUser} setLabScore={setLabScore} setLabTime={setLabTime} onComplete={() => { setUnlockedPhase(Math.max(unlockedPhase, 4)); setView('home'); }} />}
                    {view === 'p4' && <Phase4 user={user} labScore={labScore} labTime={labTime} gasUrl={gasUrl} />}
                    {view === 'profile' && renderProfile()}
                    {view === 'guide' && renderGuide()}

                    <footer className="w-full bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500 z-30 shrink-0">
                        media pembelajarn interaktif koding kelas 8 by pagurudan &amp; AI
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
